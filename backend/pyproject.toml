[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentflow-server"
version = "0.1.0"
description = "FastAPI backend for AgentFlow"
authors = [{name = "AgentFlow"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "alembic>=1.12.1",
    "sqlite3-fts4",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "fastapi-users[sqlalchemy]>=12.1.3",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "httpx>=0.25.2",
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "google-genai>=1.0.0",
    "mistralai>=0.0.8",
    "python-telegram-bot>=20.7",
    "apscheduler>=3.10.4",
    "cryptography>=41.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "ICN", "PIE", "T20", "SIM", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
